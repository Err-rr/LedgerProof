[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerproof"
version = "0.1.0"
description = "Multi-source settlement reconciliation for Razorpay merchants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.7.0,<3.0.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "mangum>=0.17.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.34.0",
    "boto3>=1.34.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "uvicorn[standard]>=0.29.0"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
